<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AUdoc - Site Maintenance</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    :root {
      --primary-color: #4a7c59;
      --primary-dark: #2e5c3a;
      --bg-color: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
    }
    
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    
    .maintenance-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 10px 40px rgba(74, 124, 89, 0.1);
      border: 1px solid rgba(74, 124, 89, 0.1);
    }
    
    .icon-container {
      width: 80px;
      height: 80px;
      background: rgba(74, 124, 89, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: var(--primary-color);
      font-size: 2.5rem;
    }
    
    h1 {
      font-weight: 800;
      font-size: 1.75rem;
      color: var(--primary-dark);
      margin-bottom: 16px;
    }
    
    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .custom-message {
      background: rgba(74, 124, 89, 0.05);
      border-left: 4px solid var(--primary-color);
      padding: 16px;
      border-radius: 0 8px 8px 0;
      text-align: left;
      font-style: italic;
      color: var(--text-main);
      margin-bottom: 24px;
    }
    
    .spinner-border {
      color: var(--primary-color);
      width: 1.5rem;
      height: 1.5rem;
      margin-right: 10px;
      vertical-align: text-bottom;
    }
    
    .reloading-text {
      display: inline-block;
      font-weight: 600;
      color: var(--primary-color);
    }
  </style>
</head>
<body>

  <div class="maintenance-card">
    <div class="icon-container">
      <i class="bi bi-tools"></i>
    </div>
    
    <h1>Site Offline for Maintenance</h1>
    
    {% if custom_message %}
      <div class="custom-message">
        "{{ custom_message }}"
      </div>
    {% else %}
      <p>AUdoc is currently undergoing scheduled maintenance to improve our services. We apologize for the inconvenience.</p>
    {% endif %}
    
    <div class="mt-4">
      <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
      <span class="reloading-text">Auto-refreshing to check status...</span>
    </div>
  </div>

  <script>
    // Auto-reload every 20 seconds to check if the site is back up
    setTimeout(() => location.reload(), 20000);
  </script>

</body>
</html>
