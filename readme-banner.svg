<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a7c59"/>
      <stop offset="100%" stop-color="#2e5c3a"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#e8f5ec" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#e8f5ec" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="10%" cy="95%" r="55%">
      <stop offset="0%" stop-color="#d5f0e2" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#d5f0e2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="0" fill="url(#bg)"/>
  <rect width="1200" height="280" fill="url(#glow)"/>
  <rect width="1200" height="280" fill="url(#glow2)"/>

  <!-- soft decorative circles, glass-morphism nod -->
  <circle cx="1080" cy="60" r="120" fill="#ffffff" opacity="0.05"/>
  <circle cx="1150" cy="220" r="90" fill="#e8f5ec" opacity="0.07"/>
  <circle cx="70" cy="230" r="70" fill="#ffffff" opacity="0.04"/>

  <!-- Icon chip (matches the app's rounded icon-chip style) -->
  <rect x="80" y="90" width="100" height="100" rx="24" fill="#ffffff" opacity="0.97"/>
  <!-- heart-pulse glyph -->
  <path d="M100 142 h18 l8 -20 l12 34 l10 -24 l6 10 h26"
        fill="none" stroke="#4a7c59" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="210" y="150" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff">AUdoc</text>
  <text x="210" y="184" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="21" font-weight="400" fill="#e8f5ec">Campus Healthcare Portal · Assam University Silchar</text>

  <!-- pill tags, mirroring the app's rounded pill buttons -->
  <rect x="212" y="204" width="128" height="34" rx="17" fill="#ffffff" opacity="0.95"/>
  <text x="276" y="226" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="14" font-weight="600" fill="#2e5c3a" text-anchor="middle">voiddoc.me</text>

  <rect x="352" y="204" width="172" height="34" rx="17" fill="#ffffff" opacity="0.16"/>
  <circle cx="374" cy="221" r="5" fill="#ff6b6b"/>
  <text x="392" y="226" font-family="Segoe UI, Verdana, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start">Blood Bank · Live</text>
</svg>
